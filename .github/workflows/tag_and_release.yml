name: Tag and Release

# Releases happen from push-triggered runs: merging the release-please PR
# pushes to main, where the reusable workflow detects the pending release and
# tags/publishes. pull_request_target must not be used here — npm's
# trusted-publishing OIDC exchange rejects tokens from that trigger.
on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  pull-requests: write
  contents: write
  id-token: write
  actions: write

jobs:
  node:
    uses: gjtorikian/actions/.github/workflows/node_package_release.yml@main
    secrets:
      gh_token: ${{ secrets.GITHUB_TOKEN }}
    with:
      version_filepath: package.json
      prepare: ${{ github.event_name == 'push' }}
      release: ${{ github.event_name == 'workflow_dispatch' }}
