name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # The suite is serial (vitest --no-file-parallelism) and the cross-process
    # suites use compressed 2 s TTLs — well under a minute on SQLite.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # The store is Node's built-in `node:sqlite` (unflagged from 22.13),
          # and test/helpers/worker-proc.ts spawns node directly on a .ts file,
          # which needs native type stripping (unflagged from 22.18).
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test (full suite, incl. cross-process race/fencing/reclaim)
        run: npm test -- --reporter=default --reporter=json --outputFile=vitest-report.json
